name: Validate observation workspace and cPanel release
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    # Pin the supported OS alongside the pinned Chromium/WebKit test engines.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use HTTPS and bounded Ubuntu package downloads
        run: |
          sudo python3 - <<'PY'
          import pathlib, re
          paths = [pathlib.Path('/etc/apt/sources.list'), *pathlib.Path('/etc/apt/sources.list.d').glob('*.list'), *pathlib.Path('/etc/apt/sources.list.d').glob('*.sources')]
          for path in paths:
              if path.is_file():
                  original = path.read_text()
                  updated = re.sub(r'http://((?:[A-Za-z0-9-]+\.)*(?:archive|security)\.ubuntu\.com/ubuntu)', r'https://\1', original)
                  if updated != original:
                      path.write_text(updated)
                      print('Using HTTPS for official Ubuntu mirror in', path)
          pathlib.Path('/etc/apt/apt.conf.d/99bounded-ci').write_text('Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "2";\nAPT::Update::Error-Mode "any";\n')
          PY
      - name: Install native PHP runtime
        timeout-minutes: 4
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-sqlite3 php-curl php-mbstring
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /prophecy
      - run: node scripts/check-export.mjs
      - name: Native account, payment, source and AI contracts
        working-directory: .
        run: |
          php backend/test/contracts.php
          php backend/test/concurrency.php
      - name: Native HTTP security and complete private workflows
        working-directory: .
        run: python3 backend/test/test_http.py
      - name: Install browser system dependencies
        timeout-minutes: 6
        run: npx playwright install-deps chromium webkit
      - name: Download isolated browser engines
        timeout-minutes: 4
        run: npx playwright install chromium webkit
      - name: Desktop, Android and iPhone journeys plus accessibility
        run: npm run test:browser
      - name: Package separate public and private cPanel files
        working-directory: .
        run: python3 scripts/package-cpanel.py
      - uses: actions/upload-artifact@v4
        with:
          name: prophecytracker-static-dashboard
          path: frontend/out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: prophecytracker-cpanel-release
          path: prophecytracker-cpanel-release.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prophecytracker-browser-evidence
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
